<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="Sign up for Harmony Heights' newsletter to receive exclusive updates, music releases, and tour information directly to your inbox.">
        <title>Harmony Heights: Sign Up for Updates</title>
        </head>
    <body>
        <h1>Sign Up</h1>
        <p>Join our mailing list to stay informed about our latest music, tour dates, and exclusive content.</p>

        <form action="https://example.com/subscribe" method="post">
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required><br>

             <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br>

              <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required><br>

            <input type="submit" value="Subscribe"><br>

              <label for="gender">Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male" required><label for="male">Male</label><br>
            <input type="radio" id="female" name="gender" value="female" required><label for="female">Female</label><br>
        </form>

        <p>We respect your privacy. Your information will not be shared.</p>
    </body>
    </html>
